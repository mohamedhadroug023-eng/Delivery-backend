<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Restaurant - HADROUG DELIVERY</title>
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .signup-card {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 550px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 10px;
        }

        .app-title {
            font-size: 22px;
            color: #2E7D32;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        .input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }

        .input:focus {
            outline: none;
            border-color: #2E7D32;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
        }

        .gps-btn {
            background-color: #e8f5e9;
            color: #2E7D32;
            border: 1px solid #2E7D32;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
            font-weight: bold;
        }

        .gps-btn:hover {
            background-color: #c8e6c9;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #555;
            margin: 10px 0;
        }

        .alert-box {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }

        .alert-error {
            background-color: #ffebee;
            color: #c62828;
        }

        .alert-success {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #2E7D32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #1B5E20;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #2E7D32;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>

<body>

    <div class="signup-card">
        
        <div class="header-section">
            <img src="photo1.png" alt="Hadroug Delivery Logo" class="logo">
            <h1 class="app-title">HADROUG DELIVERY</h1>
            <p class="subtitle">Inscription Espace Restaurant</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <form id="signupForm">
            
            <div class="form-grid">

                <div class="form-group full-width">
                    <label>Nom du restaurant :</label>
                    <input type="text" id="restaurant_name" placeholder="ex: Mlewi Dali" required class="input">
                </div>

                <div class="form-group">
                    <label>Nom du responsable :</label>
                    <input type="text" id="manager_name" placeholder="ex: Mohamed" required class="input">
                </div>

                <div class="form-group">
                    <label>Numéro de téléphone :</label>
                    <input type="tel" id="phone" placeholder="20123456" required class="input">
                </div>

                <div class="form-group full-width">
                    <label>Email :</label>
                    <input type="email" id="email" placeholder="restaurant@gmail.com" required class="input">
                </div>

                <div class="form-group">
                    <label>Mot de passe :</label>
                    <input type="password" id="pwd" placeholder="••••••••" required class="input">
                </div>

                <div class="form-group">
                    <label>Confirmer mot de passe :</label>
                    <input type="password" id="pwdConfirm" placeholder="••••••••" required class="input">
                </div>

                <div class="form-group full-width">
                    <label>Adresse du restaurant :</label>
                    <input type="text" id="address" placeholder="Rue, Ville, Sousse" required class="input">
                </div>

                <div class="form-group full-width">
                    <label>Localisation Google Maps :</label>
                    <input type="text" id="google_maps_link" placeholder="Lien Google Maps" class="input">
                    <button type="button" class="gps-btn" onclick="getGPSLocation()">📍 Capturer ma position GPS exacte</button>
                    <input type="hidden" id="latitude">
                    <input type="hidden" id="longitude">
                </div>

                <div class="form-group full-width">
                    <label>Type du restaurant :</label>
                    <select id="restaurant_type" required class="input">
                        <option value="">-- Choisir --</option>
                        <option value="Fast Food">Fast Food / Mlewi / Chapati</option>
                        <option value="Pizzeria">Pizzeria</option>
                        <option value="Restaurant Classique">Restaurant Classique</option>
                        <option value="Salon de thé">Salon de thé / Café</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Heure d'ouverture :</label>
                    <input type="time" id="opening_time" required class="input">
                </div>

                <div class="form-group">
                    <label>Heure de fermeture :</label>
                    <input type="time" id="closing_time" required class="input">
                </div>

                <div class="form-group full-width checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">J'accepte les <a href="#" style="color:#2E7D32;">conditions d'utilisation</a>.</label>
                </div>

                <div class="form-group full-width">
                    <button type="submit" class="btn-submit">S'inscrire</button>
                </div>

            </div>

        </form>

        <div class="login-link">
            Déjà un compte ? <a href="restaurant_login.html">Se connecter</a>
        </div>

    </div>

    <script>
        function getGPSLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById('latitude').value = position.coords.latitude;
                        document.getElementById('longitude').value = position.coords.longitude;
                        alert("Position GPS capturée avec succès !");
                    },
                    () => alert("Impossible d'obtenir la position GPS. Assurez-vous d'activer la localisation.")
                );
            } else {
                alert("La géolocalisation n'est pas supportée par votre navigateur.");
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'none';

            const pwd = document.getElementById('pwd').value;
            const pwdConfirm = document.getElementById('pwdConfirm').value;

            if (pwd !== pwdConfirm) {
                alertBox.className = 'alert-box alert-error';
                alertBox.innerText = 'Les mots de passe ne correspondent pas !';
                alertBox.style.display = 'block';
                return;
            }

            const payload = {
                restaurant_name: document.getElementById('restaurant_name').value,
                manager_name: document.getElementById('manager_name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                password: pwd,
                address: document.getElementById('address').value,
                google_maps_link: document.getElementById('google_maps_link').value,
                latitude: document.getElementById('latitude').value,
                longitude: document.getElementById('longitude').value,
                restaurant_type: document.getElementById('restaurant_type').value,
                opening_time: document.getElementById('opening_time').value,
                closing_time: document.getElementById('closing_time').value
            };

            try {
                const response = await fetch('http://localhost:3000/api/restaurant/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    alertBox.className = 'alert-box alert-success';
                    alertBox.innerText = 'Inscription réussie ! Redirection en cours...';
                    alertBox.style.display = 'block';
                    setTimeout(() => window.location.href = 'restaurant_login.html', 2000);
                } else {
                    alertBox.className = 'alert-box alert-error';
                    alertBox.innerText = data.message;
                    alertBox.style.display = 'block';
                }
            } catch (error) {
                alertBox.className = 'alert-box alert-error';
                alertBox.innerText = 'Erreur de connexion avec le serveur.';
                alertBox.style.display = 'block';
            }
        });
    </script>

</body>
</html>
